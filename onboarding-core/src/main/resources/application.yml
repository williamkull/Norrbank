spring:
  application:
    name: onboarding-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:onboarding-db.norrbank.internal}:5432/onboarding
    username: ${DB_USER:onboarding_core}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka.norrbank.internal:9092}

server:
  port: 8080

logging:
  level:
    se.norrbank.onboarding: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:onboarding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/local-data.sql
